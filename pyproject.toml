[project]
name = "fewsats-mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
# Permite ejecutar el servidor con un comando simple
run-server = "fewsats_mcp:main"

[tool.uv]
dev-dependencies = [
    "ruff",
    "pytest",
    "httpx",
]